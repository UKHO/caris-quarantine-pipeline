trigger: none
pr: none

# Handles multi-arch OCI image index pushes (application/vnd.oci.image.index.v1+json).
# Single-arch OCI image manifests (application/vnd.oci.image.manifest.v1+json) are
# handled by a separate pipeline (quarantine-oci-image-manifest.yml) because Azure
# DevOps triggers a pipeline only once events are received for ALL of its webhook
# resources — so the two media types cannot share one pipeline definition.
resources:
  webhooks:
    - webhook: AcrWebhookTrigger
      connection: AcrWebhookConnection
      filters:
        - path: target.mediaType
          value: "application/vnd.oci.image.index.v1+json"

variables:
  - template: templates/common-variables.yml

stages:
- template: templates/container-scan-template.yml
  parameters:
    sourceRegistryServiceConnection: '$(sourceRegistryServiceConnection)'
    sourceAzureSubscription: '$(sourceAzureSubscription)'
    snykServiceConnection: '$(snykServiceConnection)'
    snykOrganization: '$(snykOrganization)'
    teamsWebhookEndpoint: '$(teamsWebhookEndpoint)'
    globalPreRegistryServiceConnection: '$(globalPreRegistryServiceConnection)'
    globalLiveRegistryServiceConnection: '$(globalLiveRegistryServiceConnection)'
    globalPreRegistry: '$(globalPreRegistry)'
    globalLiveRegistry: '$(globalLiveRegistry)'
    sourceRepository: ${{ parameters.AcrWebhookTrigger.target.repository }}
    sourceTag: ${{ parameters.AcrWebhookTrigger.target.tag }}
    sourceDigest: ${{ parameters.AcrWebhookTrigger.target.digest }}
    sourceHost: ${{ parameters.AcrWebhookTrigger.request.host }}
