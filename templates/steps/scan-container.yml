parameters:
  - name: sourceRegistryServiceConnection
    type: string
  - name: sourceHost
    type: string
  - name: sourceRepository
    type: string
  - name: sourceTag
    type: string
  - name: snykOrganization
    type: string
  - name: snykServiceConnection
    type: string

steps:
- task: Docker@2
  displayName: 'Login to Source Registry'
  inputs:
    containerRegistry: '${{ parameters.sourceRegistryServiceConnection }}'
    command: 'login'

- task: PowerShell@2
  displayName: 'Pull Published Image'
  inputs:
    targetType: 'inline'
    script: |
      $resolved = "$(resolvedTag)"
      $paramTag = "${{ parameters.sourceTag }}"
      Write-Host "DEBUG: resolvedTag variable = '$resolved'"
      Write-Host "DEBUG: sourceTag parameter = '$paramTag'"

      # Use resolvedTag if it's a real value (not empty, not the literal macro, not None)
      if ($resolved -and $resolved -ne '$(resolvedTag)' -and $resolved -ne 'None') {
        $tag = $resolved
        Write-Host "Using resolved tag: $tag"
      } elseif ($paramTag -and $paramTag -ne 'None') {
        $tag = $paramTag
        Write-Host "Using parameter tag: $tag"
      } else {
        Write-Host "##[error]No valid tag available. resolvedTag='$resolved', paramTag='$paramTag'"
        exit 1
      }
      $image = "${{ parameters.sourceHost }}/${{ parameters.sourceRepository }}:$tag"
      Write-Host "Pulling image: $image"
      docker pull $image
      if ($LASTEXITCODE -ne 0) { exit 1 }
      Write-Host "##vso[task.setvariable variable=scannedImage]$image"

- task: UkhoSnykScanTask@0
  displayName: 'Snyk container scan'
  inputs:
    failOnIssues: true
    organization: '${{ parameters.snykOrganization }}'
    serviceConnectionEndpoint: '${{ parameters.snykServiceConnection }}'
    testType: container
    monitorWhen: always
    severityThreshold: high
    dockerImageName: '$(scannedImage)'
