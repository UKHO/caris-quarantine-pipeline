parameters:
  - name: sourceRegistryServiceConnection
    type: string
  - name: sourceHost
    type: string
  - name: sourceRepository
    type: string
  - name: sourceTag
    type: string
  - name: snykOrganization
    type: string
  - name: snykServiceConnection
    type: string

steps:
- task: Docker@2
  displayName: 'Login to Source Registry'
  inputs:
    containerRegistry: '${{ parameters.sourceRegistryServiceConnection }}'
    command: 'login'

- task: PowerShell@2
  displayName: 'Pull Published Image'
  inputs:
    targetType: 'inline'
    script: |
      $tag = "${{ parameters.sourceTag }}"

      # Defensive guard: OCI referrers (e.g. notation signatures) are published
      # under a sha256-<digest> fallback tag and are not scannable images. The
      # Detect job normally skips these, but guard here too so a plain docker
      # pull never fails on 'unsupported media type ...notary.signature'.
      if ($tag -match '^sha256-[0-9a-f]{64}$') {
        Write-Host "Referrer/signature fallback tag '$tag' detected; skipping pull and scan."
        Write-Host "##vso[task.setvariable variable=skipScan]true"
        exit 0
      }

      $image = "${{ parameters.sourceHost }}/${{ parameters.sourceRepository }}:$tag"
      Write-Host "Pulling image: $image"

      # Retry with backoff. When a multi-arch image is imported into the source
      # registry, ACR fires the push webhook (triggering this pipeline) as soon
      # as the manifest list appears, which can be before all child manifests
      # have finished copying. A pull issued in that window fails with
      # 'manifest unknown'/'not found'. Retrying lets the import finish before we
      # give up, so the scan no longer fails on a transient race.
      $maxAttempts = 5
      for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
        docker pull $image
        if ($LASTEXITCODE -eq 0) { break }
        if ($attempt -eq $maxAttempts) {
          Write-Host "##vso[task.logissue type=error]docker pull failed for $image after $maxAttempts attempts."
          exit 1
        }
        $delay = 15 * $attempt
        Write-Host "Pull attempt $attempt/$maxAttempts failed (exit $LASTEXITCODE); retrying in ${delay}s (image may still be importing)."
        Start-Sleep -Seconds $delay
      }
      Write-Host "##vso[task.setvariable variable=scannedImage]$image"

- task: UkhoSnykScanTask@0
  displayName: 'Snyk container scan'
  condition: and(succeeded(), ne(variables['skipScan'], 'true'))
  inputs:
    failOnIssues: true
    organization: '${{ parameters.snykOrganization }}'
    serviceConnectionEndpoint: '${{ parameters.snykServiceConnection }}'
    testType: container
    monitorWhen: always
    severityThreshold: high
    dockerImageName: '$(scannedImage)'
