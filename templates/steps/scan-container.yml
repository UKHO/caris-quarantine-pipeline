parameters:
  - name: sourceRegistryServiceConnection
    type: string
  - name: sourceHost
    type: string
  - name: sourceRepository
    type: string
  - name: sourceTag
    type: string
  - name: snykOrganization
    type: string
  - name: snykServiceConnection
    type: string

steps:
- task: Docker@2
  displayName: 'Login to Source Registry'
  inputs:
    containerRegistry: '${{ parameters.sourceRegistryServiceConnection }}'
    command: 'login'

- task: PowerShell@2
  displayName: 'Pull Published Image'
  inputs:
    targetType: 'inline'
    script: |
      $image = "${{ parameters.sourceHost }}/${{ parameters.sourceRepository }}:${{ parameters.sourceTag }}"
      Write-Host "Pulling image: $image"
      docker pull $image
      if ($LASTEXITCODE -ne 0) { exit 1 }
      Write-Host "##vso[task.setvariable variable=scannedImage]$image"

- task: UkhoSnykScanTask@0
  displayName: 'Snyk container scan'
  inputs:
    failOnIssues: true
    organization: '${{ parameters.snykOrganization }}'
    serviceConnectionEndpoint: '${{ parameters.snykServiceConnection }}'
    testType: container
    monitorWhen: always
    severityThreshold: high
    dockerImageName: '$(scannedImage)'

# Publish an output variable that downstream push stages can OR together to
# determine whether the scan passed. Only runs when all prior steps (including
# the Snyk scan) succeeded, so 'passed=true' reliably signals a clean scan.
# This avoids relying on stage-level succeeded('ScanContainer'), which returns
# false whenever the stage contains a skipped job (the Windows scan job is
# skipped for Linux images and vice versa).
- pwsh: Write-Host "##vso[task.setvariable variable=passed;isOutput=true]true"
  name: scanResult
  displayName: 'Mark scan passed'
