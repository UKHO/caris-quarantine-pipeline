parameters:
  - name: sourceAzureSubscription
    type: string
  - name: sourceHost
    type: string
  - name: sourceRepository
    type: string
  - name: sourceTag
    type: string

steps:
- task: AzureCLI@2
  displayName: 'Detect platform from manifest'
  name: platform
  inputs:
    azureSubscription: '${{ parameters.sourceAzureSubscription }}'
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      $registry = "${{ parameters.sourceHost }}"
      $repository = "${{ parameters.sourceRepository }}"
      $tag = "${{ parameters.sourceTag }}"
      $acrName = $registry -replace '\.azurecr\.io$',''

      Write-Host "Detecting platform for ${registry}/${repository}:${tag}"

      $os = $null
      $isReferrer = $false

      # OCI referrers (e.g. notation signatures) are published under a fallback
      # tag of the form sha256-<64 hex>. Genuine images never use this tag shape,
      # so it is a safe secondary signal that the artifact is not scannable.
      $looksLikeReferrerTag = $tag -match '^sha256-[0-9a-f]{64}$'

      # Try az acr manifest show first (handles auth via service connection)
      try {
        $manifestJson = az acr manifest show --registry $acrName --name "${repository}:${tag}" --only-show-errors 2>&1
        if ($LASTEXITCODE -eq 0) {
          $manifest = $manifestJson | ConvertFrom-Json
          if ($manifest.manifests) {
            # Skip attestation manifests (os=unknown) and pick first real platform
            $platformEntry = $manifest.manifests | Where-Object { $_.platform.os -and $_.platform.os -ne 'unknown' } | Select-Object -First 1
            if ($platformEntry) {
              $os = $platformEntry.platform.os
              Write-Host "Manifest list detected, OS: $os"
            } else {
              # An index with no runnable platform entries is a signature/
              # attestation/referrer artifact (e.g. application/vnd.cncf.notary.signature),
              # not a scannable image. Flag it so the scan and promotion are skipped.
              $artifactTypes = ($manifest.manifests | ForEach-Object { $_.artifactType } | Where-Object { $_ }) -join ', '
              $isReferrer = $true
              Write-Host "Index has no runnable platform; treating as non-scannable referrer/signature artifact. artifactTypes: $artifactTypes"
            }
          } elseif ($manifest.subject) {
            # A manifest carrying a subject is a referrer to another image.
            $isReferrer = $true
            Write-Host "Manifest has a subject reference; treating as non-scannable referrer/signature artifact."
          } elseif ($manifest.config.digest) {
            # Single-platform manifest - fetch config blob via REST with CLI token
            $configDigest = $manifest.config.digest
            Write-Host "Single-platform manifest, fetching config blob: $configDigest"
            $loginResult = az acr login --name $acrName --expose-token --only-show-errors | ConvertFrom-Json
            $refreshToken = $loginResult.accessToken
            $body = @{
              grant_type = "refresh_token"
              service = $registry
              scope = "repository:${repository}:pull"
              refresh_token = $refreshToken
            }
            $token = (Invoke-RestMethod -Uri "https://$registry/oauth2/token" -Method POST -Body $body).access_token
            $blobHeaders = @{ "Authorization" = "Bearer $token" }
            $config = Invoke-RestMethod -Uri "https://$registry/v2/$repository/blobs/$configDigest" -Headers $blobHeaders
            $os = $config.os
            Write-Host "OS from config blob: $os"
          }
        } else {
          Write-Host "WARNING: az acr manifest show failed: $manifestJson"
        }
      } catch {
        Write-Host "WARNING: Exception during manifest detection: $_"
      }

      # Fallback: use REST API with token exchange
      if (-not $os) {
        Write-Host "Trying REST API fallback..."
        try {
          $loginResult = az acr login --name $acrName --expose-token --only-show-errors | ConvertFrom-Json
          $refreshToken = $loginResult.accessToken
          $body = @{
            grant_type = "refresh_token"
            service = $registry
            scope = "repository:${repository}:pull"
            refresh_token = $refreshToken
          }
          $token = (Invoke-RestMethod -Uri "https://$registry/oauth2/token" -Method POST -Body $body).access_token

          $manifestHeaders = @{
            "Authorization" = "Bearer $token"
            "Accept" = "application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.index.v1+json"
          }
          $manifest = Invoke-RestMethod -Uri "https://$registry/v2/$repository/manifests/$tag" -Headers $manifestHeaders

          if ($manifest.manifests) {
            $platformEntry = $manifest.manifests | Where-Object { $_.platform.os -and $_.platform.os -ne 'unknown' } | Select-Object -First 1
            if ($platformEntry) {
              $os = $platformEntry.platform.os
              Write-Host "REST: Manifest list detected, OS: $os"
            } else {
              $artifactTypes = ($manifest.manifests | ForEach-Object { $_.artifactType } | Where-Object { $_ }) -join ', '
              $isReferrer = $true
              Write-Host "REST: Index has no runnable platform; treating as non-scannable referrer/signature artifact. artifactTypes: $artifactTypes"
            }
          } elseif ($manifest.subject) {
            $isReferrer = $true
            Write-Host "REST: Manifest has a subject reference; treating as non-scannable referrer/signature artifact."
          } elseif ($manifest.config.digest) {
            $blobHeaders = @{ "Authorization" = "Bearer $token" }
            $config = Invoke-RestMethod -Uri "https://$registry/v2/$repository/blobs/$($manifest.config.digest)" -Headers $blobHeaders
            $os = $config.os
            Write-Host "REST: OS from config blob: $os"
          }
        } catch {
          Write-Host "WARNING: REST API fallback failed: $_"
        }
      }

      # A signature/referrer artifact is not a scannable image. Emit skip=true so
      # the scan and promotion stages are bypassed and no failure alert fires.
      # The sha256-<digest> fallback tag is a safe secondary signal (genuine
      # images never use that tag shape).
      if (-not $os -and ($isReferrer -or $looksLikeReferrerTag)) {
        Write-Host "Artifact identified as a signature/referrer; skipping scan and promotion."
        Write-Host "##vso[task.setvariable variable=os;isOutput=true]"
        Write-Host "##vso[task.setvariable variable=skip;isOutput=true]true"
        exit 0
      }

      # Fail-safe: if the artifact could not be classified, treat it as a
      # scannable Linux image rather than silently skipping a possible real image.
      if (-not $os) {
        Write-Host "Unable to determine OS, defaulting to linux"
        $os = "linux"
      }

      Write-Host "Detected platform OS: $os"
      Write-Host "##vso[task.setvariable variable=os;isOutput=true]$os"
      Write-Host "##vso[task.setvariable variable=skip;isOutput=true]false"
      exit 0
