parameters:
  - name: sourceRegistryServiceConnection
    type: string
  - name: sourceHost
    type: string
  - name: sourceRepository
    type: string
  - name: sourceTag
    type: string
  - name: targetRegistryServiceConnection
    type: string
  - name: targetRegistryDisplayName
    type: string
  - name: targetImageName
    type: string
  - name: targetRepository
    type: string
  - name: targetTag
    type: string
  - name: tagDisplayName
    type: string
    default: 'Tag Image'
  - name: pushDisplayName
    type: string
    default: 'Push Image'

steps:
- task: Docker@2
  displayName: 'Login to Source Registry'
  inputs:
    containerRegistry: '${{ parameters.sourceRegistryServiceConnection }}'
    command: 'login'

- task: PowerShell@2
  displayName: 'Pull Published Image'
  inputs:
    targetType: 'inline'
    script: |
      $image = "${{ parameters.sourceHost }}/${{ parameters.sourceRepository }}:${{ parameters.sourceTag }}"
      Write-Host "Pulling image: $image"

      # Retry with backoff. When a multi-arch image is imported into the source
      # registry, ACR fires the push webhook (triggering this pipeline) as soon
      # as the manifest list appears, which can be before all child manifests
      # have finished copying. A pull issued in that window fails with
      # 'manifest unknown'/'not found'. Retrying lets the import finish before we
      # give up, so the promotion no longer fails on a transient race.
      $maxAttempts = 5
      for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
        docker pull $image
        if ($LASTEXITCODE -eq 0) { break }
        if ($attempt -eq $maxAttempts) {
          Write-Host "##vso[task.logissue type=error]docker pull failed for $image after $maxAttempts attempts."
          exit 1
        }
        $delay = 15 * $attempt
        Write-Host "Pull attempt $attempt/$maxAttempts failed (exit $LASTEXITCODE); retrying in ${delay}s (image may still be importing)."
        Start-Sleep -Seconds $delay
      }
      Write-Host "##vso[task.setvariable variable=sourceImage]$image"

- task: Docker@2
  displayName: '${{ parameters.targetRegistryDisplayName }}'
  inputs:
    containerRegistry: '${{ parameters.targetRegistryServiceConnection }}'
    command: 'login'

- task: PowerShell@2
  displayName: '${{ parameters.tagDisplayName }}'
  inputs:
    targetType: 'inline'
    script: |
      $sourceImage = "${{ parameters.sourceHost }}/${{ parameters.sourceRepository }}:${{ parameters.sourceTag }}"
      $targetImage = "${{ parameters.targetImageName }}"
      Write-Host "Tagging: $sourceImage -> $targetImage"
      docker tag $sourceImage $targetImage
      if ($LASTEXITCODE -ne 0) { exit 1 }

- task: Docker@2
  displayName: '${{ parameters.pushDisplayName }}'
  inputs:
    containerRegistry: '${{ parameters.targetRegistryServiceConnection }}'
    repository: '${{ parameters.targetRepository }}'
    command: 'push'
    tags: '${{ parameters.targetTag }}'
